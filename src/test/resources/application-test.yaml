app:
  jwt:
    secret: ${APP_JWT_SECRET:test-secret-0123456789abcdefghijklmnopqrstuvwxyz}
    expiration: ${APP_JWT_EXPIRATION:3600000}

  oauth:
    google:
      client-id: ${GOOGLE_CLIENT_ID:test-client-id.apps.googleusercontent.com}
    onboarding:
      ttl-ms: 600000

spring:
  sql:
    init:
      # Region/Comuna son tablas con FK desde Profile; los tests no corren
      # DataInitializer (app.seed.enabled=false), así que sin este seed cualquier
      # userService.create(...) viola la FK de profile.
      mode: always
      data-locations: classpath:test-data.sql

  # Valores ficticios: los tests construyen R2StorageService pero nunca llaman a
  # R2 de verdad (video y presign no requieren red; los uploads se mockean).
  r2:
    account-id: ${R2_ACCOUNT_ID:testaccount}
    access-key-id: ${R2_ACCESS_KEY_ID:testaccesskey}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:testsecretkeytestsecretkeytestsecretkey}
    bucket: ${R2_BUCKET:trailers-test}
    public-base-url: ${R2_PUBLIC_BASE_URL:https://pub-test.r2.dev}

  security:
    login:
      # Los tests exercised logins fallidos a proposito; con los limites reales
      # (5 por correo) una clase se auto-bloquearia a mitad de la suite. El
      # comportamiento del limiter se cubre en LoginAttemptLimiterTest, que
      # instancia su propia instancia con limites chicos.
      max-per-email: 1000
      max-per-ip: 1000
      window-ms: 900000
